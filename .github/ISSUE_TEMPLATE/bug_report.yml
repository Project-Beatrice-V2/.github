name: Bug report
description: Report a reproducible problem with a Beatrice project.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting option on the repository's Security tab.
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Include the app version or commit, OS and relevant hardware or browser.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, personal data and sensitive audio.
